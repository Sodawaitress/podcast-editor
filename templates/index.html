<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>播客剪辑</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>播客剪辑</h1>

    <div class="upload-area">
      <input type="file" id="fileInput" accept="audio/*">
      <button onclick="uploadFile()">上传并转录</button>
    </div>

    <div id="status"></div>

    <div class="editor">
      <div id="segmentList"></div>
      <div class="actions" id="actions" style="display:none">
        <button onclick="exportAudio()">导出剪辑后音频</button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
